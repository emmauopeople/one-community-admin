name: Admin Dashboard CD

on:
  push:
    branches:
      - release

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  FRONTEND_DIR: admin-frontend
  BACKEND_DIR: admin-backend
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Admin Images
    runs-on: ubuntu-latest

    outputs:
      frontend_image: ${{ steps.image_names.outputs.frontend_image }}
      backend_image: ${{ steps.image_names.outputs.backend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image_names
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          FRONTEND_IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/one-community-admin-frontend:${SHORT_SHA}"
          BACKEND_IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/one-community-admin-backend:${SHORT_SHA}"

          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Frontend image: ${FRONTEND_IMAGE}"
          echo "Backend image: ${BACKEND_IMAGE}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          file: ${{ env.FRONTEND_DIR }}/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.admin.cameroonskills.org/api/admin
          tags: |
            ${{ steps.image_names.outputs.frontend_image }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          file: ${{ env.BACKEND_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.backend_image }}

  deploy:
    name: Deploy Admin Dashboard to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ADMIN_SERVER_HOST }}
          username: ${{ secrets.ADMIN_SERVER_USER }}
          key: ${{ secrets.ADMIN_SERVER_SSH_KEY }}
          port: ${{ secrets.ADMIN_SERVER_PORT }}
          script: |
            set -e

            cd /home/ubuntu/admin-app

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            cat > .env.deploy <<EOF
            ADMIN_FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend_image }}
            ADMIN_BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend_image }}
            EOF

            chmod 600 .env.deploy

            docker compose --env-file .env --env-file .env.deploy pull admin-frontend admin-backend
            docker compose --env-file .env --env-file .env.deploy up -d --force-recreate

            docker image prune -f

            docker compose --env-file .env --env-file .env.deploy ps